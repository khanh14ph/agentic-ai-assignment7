# Assignment 7, Part A, tasks 1 and 2: open coding of the 60 recorded runs in
# fixtures/traces7/, read in file-name order (agent, direct, planned, workflow).
#
# For each run: the decision it made (slide 25: act, refuse, stop; `none` when it ended
# before any write; `escalate` when the harness ended it), whether its end state was
# right (`right`) or not (`failed`), and the first thing that went wrong, in one
# sentence, before any grouping. `kind` was added afterwards (axial coding, task 2).
# tests/test_eval.py checks eval/grounded.py against every `verdict` here whose issue
# is in the golden set.
#
# Saturation: the sixth and last kind (no_label_or_pr) first appeared at run 31,
# direct-issue-4620; runs 32 to 60 added no new kind.

kinds:
  out_of_turns: Ran out of turns before posting the comment
  acted_when_should_stop: Triaged an issue that should be left alone
  no_label_or_pr: Stopped after the comment, with no label and no pull request
  wrong_kind: Labelled a question as a bug or as docs
  reporters_file: Named the file the reporter blamed, not the one at fault
  caller_not_cause: Named the file that reports the error, not the one that causes it

